<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 검색 로봇 인덱싱 영구 차단 -->
  <meta name="robots" content="noindex, nofollow">
  <title>[관리자] 입점 업체 & 광고 구좌 관리 | 동네책자</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    /* 어드민 관리자 전용 주황/회색 스킨 */
    .admin-banner {
      background-color: #d35400;
      color: white;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      font-family: var(--font-family);
    }
    .filter-panel {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      font-family: var(--font-family);
    }
    .biz-admin-card {
      background-color: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-family: var(--font-family);
    }
    @media(min-width: 768px) {
      .biz-admin-card {
        flex-direction: row;
      }
    }
    .biz-left {
      flex: 1;
      max-width: 220px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .biz-logo-frame {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .biz-right {
      flex: 3;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .data-row {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-dark);
    }
    .data-row strong {
      color: var(--secondary);
      display: inline-block;
      width: 110px;
    }
    /* 상태 스타일 배지 */
    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .status-active { background-color: #d4efdf; color: #196f3d; }
    .status-pending { background-color: #fcf3cf; color: #7d6608; }
    .status-paused { background-color: #ebf5fb; color: #1f618d; }
    .status-expired { background-color: #fadbd8; color: #78281f; }
    .status-rejected { background-color: #f2f3f4; color: #5d6d7e; }

    .action-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .slots-table-wrap {
      overflow-x: auto;
      margin-top: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
    }
    .slots-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }
    .slots-table th, .slots-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    .slots-table th {
      background-color: #f8f9fa;
      font-weight: bold;
      color: var(--text-dark);
    }
    .slots-table tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <!-- 공통 헤더 마운트 -->
  <div id="header-container"></div>

  <main class="container" style="margin-top: 12px;">
    
    <!-- 2. 관리자 페이지 안내 배너 -->
    <div class="admin-banner">
      <span>⚙️ 동네책자 입점 업체 & 광고 관리 대시보드</span>
      <span style="font-size: 0.75rem; background-color: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px;">OPERATOR MODE</span>
    </div>

    <div style="margin-bottom: 20px; font-family: var(--font-family);">
      <h1 style="font-size: 1.5rem; font-weight: 900; color: var(--secondary); margin-bottom: 6px;">입점 파트너 및 광고 계약 현황</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
        등록된 입점 업체의 정보(전화, 카톡, 홈페이지)와 연결된 광고 구좌의 상태 및 유효 기간을 모니터링하는 페이지입니다.
      </p>
    </div>

    <!-- 요약 통계 카드 섹션 -->
    <section class="summary-box" style="font-family: var(--font-family); grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 24px;">
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">등록 업체 수</div>
        <div class="summary-value" id="stat-total-businesses">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">활성 업체 수</div>
        <div class="summary-value" id="stat-active-businesses" style="color: #27ae60;">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">계약 구좌 수</div>
        <div class="summary-value" id="stat-contracted-slots" style="color: var(--primary);">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">노출 지역 단위 수</div>
        <div class="summary-value" id="stat-exposure-regions" style="color: #2980b9;">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">생성 키워드 수</div>
        <div class="summary-value" id="stat-total-keywords" style="color: #27ae60;">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">기간 미설정 구좌 수</div>
        <div class="summary-value" id="stat-no-period-slots" style="color: #8e44ad;">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold;">확인 필요 업체 수</div>
        <div class="summary-value" id="stat-error-businesses" style="color: #e67e22;">-</div>
      </div>
    </section>

    <!-- 3. 필터 영역 -->
    <section class="filter-panel" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-company-name" style="font-size: 0.8rem; font-weight: bold;">업체명 검색</label>
        <input type="text" id="filter-company-name" class="form-input" placeholder="예: 바름공간" style="padding: 8px; font-size: 0.85rem;">
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-category" style="font-size: 0.8rem; font-weight: bold;">업종</label>
        <select id="filter-category" class="form-select" style="padding: 8px; font-size: 0.85rem;">
          <option value="all">전체 업종</option>
        </select>
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-region" style="font-size: 0.8rem; font-weight: bold;">구 단위 지역</label>
        <select id="filter-region" class="form-select" style="padding: 8px; font-size: 0.85rem;">
          <option value="all">전체 지역</option>
        </select>
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-status" style="font-size: 0.8rem; font-weight: bold;">광고 상태</label>
        <select id="filter-status" class="form-select" style="padding: 8px; font-size: 0.85rem;">
          <option value="all">전체 상태</option>
          <option value="active">active (진행중)</option>
          <option value="pending">pending (대기)</option>
          <option value="paused">paused (일시중지)</option>
          <option value="expired">expired (만료됨)</option>
          <option value="rejected">rejected (거절됨)</option>
        </select>
      </div>

      <div class="form-group" style="margin: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding-bottom: 4px;">
        <label class="form-checkbox" style="font-size: 0.85rem; margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="filter-expiring" style="width:16px; height:16px; margin:0; cursor: pointer;">
          <span>7일 이내 만료/만료됨 감지</span>
        </label>
        <label class="form-checkbox" style="font-size: 0.85rem; margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="filter-migrated" style="width:16px; height:16px; margin:0; cursor: pointer;">
          <span>이전/마이그레이션 구좌 보기</span>
        </label>
        <label class="form-checkbox" style="font-size: 0.85rem; margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="filter-no-slots" style="width:16px; height:16px; margin:0; cursor: pointer;">
          <span>구좌 없는 업체 보기</span>
        </label>
      </div>
    </section>

    <!-- 4. 업체 리스트 영역 -->
    <section id="businesses-list-container">
      <!-- JS 동적 렌더링 -->
    </section>

  </main>

  <!-- 5. 관리자용 간소 Footer -->
  <footer style="background-color: var(--bg-card); border-top: 1px solid var(--border-color); padding: 20px 0; margin-top: 48px; text-align: center; font-family: var(--font-family);">
    <div class="container">
      <p style="font-size: 0.75rem; color: var(--text-muted);">
        동네책자 내부 시스템 관리 전용 모니터링 툴입니다. 기밀 및 유출 주의.
      </p>
    </div>
  </footer>

  <script type="module">
    import { renderHeader } from '/src/components/Header.js';
    import { categories } from '/src/data/categories.js';
    import { tasks } from '/src/data/tasks.js';
    import { regions } from '/src/data/regions.js';
    import { businesses } from '/src/data/businesses.js';
    import { adSlots } from '/src/data/adSlots.js';

    // 1. 헤더 마운트
    renderHeader();

    // 2. 권한 검증
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') !== 'true') {
      alert("관리자 권한이 요구되는 페이지입니다.");
      window.location.href = "/";
    }

    const companyNameInput = document.getElementById('filter-company-name');
    const categorySelect = document.getElementById('filter-category');
    const regionSelect = document.getElementById('filter-region');
    const statusSelect = document.getElementById('filter-status');
    const expiringCheckbox = document.getElementById('filter-expiring');
    const migratedCheckbox = document.getElementById('filter-migrated');
    const noSlotsCheckbox = document.getElementById('filter-no-slots');

    const container = document.getElementById('businesses-list-container');

    // 업종 선택 필터 동적 채우기 (managed: true인 항목만 노출, general-cleaning 제외)
    const managedCats = categories.filter(c => c.managed !== false && c.visible !== false);
    categorySelect.innerHTML = '<option value="all">전체 업종</option>' +
      managedCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

    // 3. 지역 선택 드롭다운 초기화
    function initDropdowns() {
      // 구 단위 지역
      const districts = regions.filter(r => r.level === 'district' && r.visible !== false);
      regionSelect.innerHTML = '<option value="all">전체 지역</option>' + 
        districts.map(d => `<option value="${d.id}">${d.displayName}</option>`).join('');
    }

    // 4. 대표 URL 복사 함수 선언 (전역 윈도우 스코프 바인딩)
    window.copyLandingUrl = function(urlText, btnElement) {
      const fullUrl = window.location.origin + urlText;
      navigator.clipboard.writeText(fullUrl).then(() => {
        if (btnElement) {
          const originalText = btnElement.textContent;
          btnElement.textContent = "복사됨";
          btnElement.style.backgroundColor = "#27ae60";
          btnElement.style.color = "white";
          btnElement.style.borderColor = "#27ae60";
          setTimeout(() => {
            btnElement.textContent = originalText;
            btnElement.style.backgroundColor = "";
            btnElement.style.color = "";
            btnElement.style.borderColor = "";
          }, 1500);
        } else {
          alert("대표 랜딩 URL 복사 완료:\n" + fullUrl);
        }
      }).catch(err => {
        console.error("복사 실패:", err);
      });
    }

    // 5. 입점 파트너 리스트 여과 및 렌더링
    function renderBusinesses() {
      const searchName = companyNameInput.value.trim().toLowerCase();
      const catVal = categorySelect.value;
      const regVal = regionSelect.value;
      const statusVal = statusSelect.value;
      const isExpiringCheck = expiringCheckbox.checked;
      const isMigratedShow = migratedCheckbox.checked;

      const CURRENT_DATE = new Date("2026-06-30T10:30:00+09:00");

      // 통계 지표 변수
      let totalBizCount = 0;
      let activeBizCount = 0;
      let contractedSlotsCount = 0; // 계약 구좌 수 (active/pending)
      let exposureRegionsCount = 0; // 노출 지역 단위 수
      let totalKeywordsCount = 0;   // 생성 키워드 수
      let noPeriodSlotsCount = 0;   // 기간 미설정 구좌 수
      let errorBizCount = 0;        // 확인 필요 업체 수

      let html = "";

      // 1개 업체당 1개 카드를 생성하기 위한 루프
      businesses.forEach(biz => {
        // 업체명 검색 필터링
        if (searchName && !biz.brandName.toLowerCase().includes(searchName)) {
          return;
        }

        const isNoSlotsShow = noSlotsCheckbox.checked;

        // 해당 업체의 전체 구좌(adSlots) 수집
        const slotsOfBiz = adSlots.filter(slot => slot.businessId === biz.id);

        // 광고 상태/구좌 필터링 조건 적용
        let filteredSlots = [...slotsOfBiz];

        // 기본적으로 MIGRATED 상태인 구좌는 제외 (토글 체크 시에만 노출)
        if (!isMigratedShow) {
          filteredSlots = filteredSlots.filter(s => s.status !== 'migrated');
        }

        // 업종 필터링
        if (catVal !== 'all') {
          filteredSlots = filteredSlots.filter(s => s.categoryId === catVal);
        } else {
          // 업종 선택이 '전체 업종'일 때는 운영 3대 업종 구좌만 포함하고 general-cleaning 등 제외
          filteredSlots = filteredSlots.filter(s => managedCats.some(mc => mc.id === s.categoryId));
        }

        // 지역 필터링
        if (regVal !== 'all') {
          filteredSlots = filteredSlots.filter(s => s.purchaseRegionId === regVal);
        }

        // 구좌 상태 필터링
        if (statusVal !== 'all') {
          filteredSlots = filteredSlots.filter(s => s.status === statusVal);
        }

        // 만료 예정 필터링 (7일 이내 만료이거나 만료 상태 감지)
        if (isExpiringCheck) {
          filteredSlots = filteredSlots.filter(slot => {
            if (!slot.endDate || slot.endDate === "N/A" || slot.endDate === "기간 미설정") return false;
            const endDateObj = new Date(slot.endDate);
            const diffTime = endDateObj - CURRENT_DATE;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays <= 7;
          });
        }

        // 구좌 없는 업체 숨김 처리 조건 적용
        if (filteredSlots.length === 0) {
          // '구좌 없는 업체 보기' 체크박스가 켜져 있고, 실제로 등록된 전체 구좌가 0개인 업체만 노출 허용
          if (isNoSlotsShow && slotsOfBiz.length === 0) {
            // 통계 및 렌더링 유지
          } else {
            return; // 그 외의 경우는 모두 노출 제외
          }
        }

        // 데이터 오류 감지 조건
        let hasError = false;
        let errorReasons = [];
        
        if (!biz.phone || biz.phone.trim() === "" || biz.phone === "추후 입력") {
          hasError = true;
          errorReasons.push("전화번호 없음");
        }
        if (!biz.kakaoUrl || biz.kakaoUrl.trim() === "" || biz.kakaoUrl === "#") {
          hasError = true;
          errorReasons.push("카카오 URL 없음");
        }
        if (!biz.websiteUrl || biz.websiteUrl.trim() === "") {
          hasError = true;
          errorReasons.push("홈페이지 URL 없음");
        }
        if (!biz.image || biz.image.trim() === "") {
          hasError = true;
          errorReasons.push("이미지 없음");
        }
        if (slotsOfBiz.length === 0) {
          hasError = true;
          errorReasons.push("연결 구좌 없음");
        }
        
        // 슬롯 레벨 데이터 오류 검증 및 통계 누적
        filteredSlots.forEach(s => {
          if (s.slotNumber === undefined || s.slotNumber === null) {
            hasError = true;
            if (!errorReasons.includes("slotNumber 없음")) errorReasons.push("slotNumber 없음");
          }
          if (!s.status) {
            hasError = true;
            if (!errorReasons.includes("status 없음")) errorReasons.push("status 없음");
          }
          
          const regionObj = regions.find(r => r.id === s.purchaseRegionId);
          if (!regionObj) {
            hasError = true;
            if (!errorReasons.includes("구 단위 지역 매칭 실패")) errorReasons.push("구 단위 지역 매칭 실패");
          } else {
            const subDongCount = regionObj.childRegionIds ? regionObj.childRegionIds.length : 0;
            const associatedTasks = tasks.filter(t => t.categoryIds.includes(s.categoryId) && t.visible);
            if (associatedTasks.length === 0) {
              hasError = true;
              if (!errorReasons.includes("대표 랜딩 생성 실패")) errorReasons.push("대표 랜딩 생성 실패");
            }
          }
        });

        if (hasError) {
          errorBizCount++;
        }

        // 통계 연산
        totalBizCount++;
        if (biz.status === "active") {
          activeBizCount++;
        }

        filteredSlots.forEach(s => {
          if (s.status === "active" || s.status === "pending") {
            contractedSlotsCount++;
          }
          
          const regionObj = regions.find(r => r.id === s.purchaseRegionId);
          const subDongCount = regionObj && regionObj.childRegionIds ? regionObj.childRegionIds.length : 0;
          const associatedTasks = tasks.filter(t => t.categoryIds.includes(s.categoryId) && t.visible);
          
          exposureRegionsCount += (1 + subDongCount);
          totalKeywordsCount += (1 + subDongCount) * associatedTasks.length;

          // 기간 미설정 계산
          if (!s.startDate || s.startDate === "N/A" || !s.endDate || s.endDate === "N/A" || s.startDate === "기간 미설정" || s.endDate === "기간 미설정") {
            noPeriodSlotsCount++;
          }
        });

        // 렌더링용 변수 셋업
        const defaultLogo = "https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=200&q=80";
        const logoImage = biz.image || defaultLogo;

        const bizStatusText = biz.status ? biz.status.toUpperCase() : "UNKNOWN";
        let bizStatusBadgeClass = "badge-status";
        if (biz.status === "active") bizStatusBadgeClass += " status-active";
        else if (biz.status === "pending") bizStatusBadgeClass += " status-pending";
        else if (biz.status === "paused") bizStatusBadgeClass += " status-paused";
        else bizStatusBadgeClass += " status-expired";

        // 소속 업종 목록 추출
        const bizCats = biz.categoryIds ? biz.categoryIds.map(cid => {
          const c = categories.find(cat => cat.id === cid);
          return c ? c.name : cid;
        }).join(", ") : "미지정";

        // 개별 업체 카드별 구좌 통계 계산 (실제 데이터 기준)
        let bizContractedSlots = 0;
        let bizExposureRegions = 0;
        let bizTotalKeywords = 0;

        filteredSlots.forEach(s => {
          if (s.status === "active" || s.status === "pending") {
            bizContractedSlots++;
          }
          const regionObj = regions.find(r => r.id === s.purchaseRegionId);
          const subDongCount = regionObj && regionObj.childRegionIds ? regionObj.childRegionIds.length : 0;
          const associatedTasks = tasks.filter(t => t.categoryIds.includes(s.categoryId) && t.visible);
          
          bizExposureRegions += (1 + subDongCount);
          bizTotalKeywords += (1 + subDongCount) * associatedTasks.length;
        });

        // 구좌 상세 테이블 로우 HTML 빌드
        let slotsTableRowsHtml = "";
        if (filteredSlots.length === 0) {
          const placeholderMsg = slotsOfBiz.length === 0
            ? "연결된 광고 구좌가 없습니다. 업체 정보만 등록된 상태입니다."
            : "현재 필터 조건에 맞는 광고 구좌가 없습니다.";
            
          slotsTableRowsHtml = `
            <tr>
              <td colspan="11" style="text-align: center; color: var(--text-muted); padding: 16px;">
                ${placeholderMsg}
              </td>
            </tr>
          `;
        } else {
          filteredSlots.forEach(slot => {
            const categoryObj = categories.find(c => c.id === slot.categoryId);
            const catName = categoryObj ? categoryObj.name : (slot.categoryId || "미설정");

            const regionObj = regions.find(r => r.id === slot.purchaseRegionId);
            const regDisplayName = regionObj ? regionObj.displayName : (slot.purchaseRegionId || "미설정");
            const regNameOnly = regionObj ? regionObj.displayName.split(' ').pop() : "미설정";

            const subDongCount = regionObj && regionObj.childRegionIds ? regionObj.childRegionIds.length : 0;
            const associatedTasks = tasks.filter(t => t.categoryIds.includes(slot.categoryId) && t.visible);
            const taskText = associatedTasks.length > 0 ? `전체 작업명 ${associatedTasks.length}개 포함` : "전체 작업명 포함";

            const keywordsCount = (1 + subDongCount) * associatedTasks.length;

            const slotStatusText = slot.status ? slot.status.toUpperCase() : "UNKNOWN";
            let slotStatusBadgeClass = "badge-status";
            if (slot.status === "active") slotStatusBadgeClass += " status-active";
            else if (slot.status === "pending") slotStatusBadgeClass += " status-pending";
            else if (slot.status === "paused") slotStatusBadgeClass += " status-paused";
            else if (slot.status === "expired") slotStatusBadgeClass += " status-expired";
            else if (slot.status === "migrated") slotStatusBadgeClass += " status-paused";
            else slotStatusBadgeClass += " status-rejected";

            // 대표 랜딩 URL 포맷팅
            const firstTask = associatedTasks[0] || { id: slot.categoryId };
            const landingUrl = `/landing.html?reg=${encodeURIComponent(regDisplayName)}&cat=${slot.categoryId}&task=${firstTask.id}`;

            // 기간 설정 정리
            let displayPeriod = "";
            if (!slot.startDate || slot.startDate === "N/A" || slot.startDate === "null" || !slot.endDate || slot.endDate === "N/A" || slot.endDate === "null") {
              displayPeriod = "기간 미설정";
            } else {
              const fmtStart = slot.startDate.replace(/-/g, '.');
              const fmtEnd = slot.endDate.replace(/-/g, '.');
              displayPeriod = `${fmtStart} ~ ${fmtEnd}`;
              
              // 만료 여부 판정
              const endDateObj = new Date(slot.endDate);
              const diffTime = endDateObj - CURRENT_DATE;
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              if (diffDays <= 0) {
                displayPeriod += ` <span style="color:#c0392b; font-weight:bold; font-size:0.75rem;">(만료)</span>`;
              } else if (diffDays <= 7) {
                displayPeriod += ` <span style="color:#e67e22; font-weight:bold; font-size:0.75rem;">(만료 임박)</span>`;
              }
            }

            const slotNumText = slot.slotNumber ? `${slot.slotNumber}번` : "미지정";

            slotsTableRowsHtml += `
              <tr>
                <td><strong>${catName}</strong></td>
                <td>${regNameOnly}</td>
                <td style="text-align: center;">${slotNumText}</td>
                <td style="text-align: center;"><span class="${slotStatusBadgeClass}" style="font-size: 0.7rem; padding: 2px 6px;">${slotStatusText}</span></td>
                <td style="text-align: center;">1개</td>
                <td>${regNameOnly} 및 하위 동 ${subDongCount}개</td>
                <td>${taskText}</td>
                <td style="text-align: center; font-weight: bold;">${keywordsCount}개</td>
                <td style="text-align: center;">${displayPeriod}</td>
                <td style="text-align: center;">
                  <button class="btn btn-outline" style="font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;" onclick="window.copyLandingUrl('${landingUrl}', this)">복사</button>
                  <a href="${landingUrl}" target="_blank" class="btn btn-primary" style="font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; text-decoration: none; color: white;">이동</a>
                </td>
                <td style="text-align: center;">
                  <button class="btn btn-outline" style="font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; cursor: not-allowed; opacity: 0.5;" disabled>상세</button>
                </td>
              </tr>
            `;
          });
        }

        // 홈페이지/카카오채널/전화번호 예외 분기 처리
        const displayWebsite = biz.websiteUrl && biz.websiteUrl !== "추후 입력" && biz.websiteUrl !== "N/A" && biz.websiteUrl !== "null"
          ? `<a href="${biz.websiteUrl}" target="_blank" style="text-decoration: underline; color: var(--primary); font-weight: bold;">열기 ↗</a>`
          : "미설정";

        const displayKakao = biz.kakaoUrl && biz.kakaoUrl !== "#" && biz.kakaoUrl !== "null"
          ? `<a href="${biz.kakaoUrl}" target="_blank" style="color: #d35400; text-decoration: underline; font-weight: bold;">열기 ↗</a>`
          : "미설정";

        let displayPhone = biz.phone;
        if (!biz.phone || biz.phone.trim() === "" || biz.phone === "추후 입력" || biz.phone === "null") {
          displayPhone = `<span style="color: #c0392b; font-weight: bold;">추후 입력 또는 확인 필요</span>`;
        } else {
          displayPhone = `<a href="tel:${biz.phone}" style="color: var(--primary); font-weight: bold;">${biz.phone}</a>`;
        }

        const errorStatusBadge = hasError 
          ? `<span style="color: #c0392b; font-weight: bold; background-color: #fce4d6; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">⚠️ 확인 필요 (${errorReasons.join(', ')})</span>`
          : `<span style="color: #27ae60; font-weight: bold; background-color: #d4efdf; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">✅ 정상</span>`;

        html += `
          <div class="biz-admin-card" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- 상단 요약 영역 -->
            <div style="display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1.5px solid var(--border-color); padding-bottom: 16px; width: 100%;">
              
              <!-- 좌측: 로고 및 기본정보 -->
              <div class="biz-left" style="max-width: 180px; gap: 6px;">
                <div class="biz-logo-frame" style="width: 100px; height: 100px;">
                  <img src="${logoImage}" alt="${biz.brandName}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-dark); margin: 4px 0 0 0;">${biz.brandName}</h3>
                <div style="display: flex; gap: 4px; margin-top: 2px;">
                  <span class="${bizStatusBadgeClass}" style="font-size: 0.7rem; padding: 2px 6px;">${bizStatusText}</span>
                </div>
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; line-height: 1.5; text-align: left;">
                  계약 구좌 수: <strong>${bizContractedSlots}개</strong><br>
                  노출 지역 단위: <strong>${bizExposureRegions}개</strong><br>
                  생성 키워드 수: <strong>${bizTotalKeywords}개</strong><br>
                  운영 업종: <strong>${bizCats}</strong>
                </div>
              </div>

              <!-- 중앙: 상세 메타 정보 -->
              <div style="flex: 2; min-width: 280px; display: flex; flex-direction: column; gap: 6px; justify-content: center;">
                <div class="data-row"><strong>업체 고유 ID</strong>: <span style="font-family: monospace;">${biz.id}</span></div>
                <div class="data-row"><strong>전화번호</strong>: ${displayPhone}</div>
                <div class="data-row"><strong>카카오 채널</strong>: ${displayKakao}</div>
                <div class="data-row"><strong>홈페이지</strong>: ${displayWebsite}</div>
                <div class="data-row"><strong>데이터 상태</strong>: ${errorStatusBadge}</div>
              </div>

              <!-- 우측: 관리 액션 비활성화 존 -->
              <div style="flex: 1; min-width: 180px; border-left: 1px dashed var(--border-color); padding-left: 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
                <span style="font-size: 0.7rem; color: var(--text-muted); text-align: center; font-weight: bold;">⚙️ 관리자 작업 지령</span>
                <span style="font-size: 0.65rem; color: #7f8c8d; text-align: center; margin-bottom: 6px;">(정보 수정 및 광고 일시정지 준비 중)</span>
                <div class="action-btn-group" style="justify-content: center; margin: 0;">
                  <button class="btn btn-outline" style="font-size: 0.7rem; padding: 4px 8px; cursor: not-allowed; opacity: 0.5;" disabled>정보 수정</button>
                  <button class="btn btn-outline" style="font-size: 0.7rem; padding: 4px 8px; cursor: not-allowed; opacity: 0.5;" disabled>일시 정지</button>
                </div>
              </div>

            </div>

            <!-- 하단: 광고 구좌 상세 테이블 영역 -->
            <div style="width: 100%;">
              <div style="font-size: 0.8rem; font-weight: bold; color: var(--secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 4px;">
                📋 연결 광고 구좌 (필터 매칭된 구좌: ${filteredSlots.length}개 / 전체 구좌: ${slotsOfBiz.length}개)
              </div>
              <div class="slots-table-wrap">
                <table class="slots-table">
                  <thead>
                    <tr>
                      <th>업종</th>
                      <th>구 단위 지역</th>
                      <th style="text-align: center;">구좌 번호</th>
                      <th style="text-align: center;">상태</th>
                      <th style="text-align: center;">계약 구좌</th>
                      <th>노출 지역 단위</th>
                      <th>포함 작업명</th>
                      <th style="text-align: center;">생성 키워드 수</th>
                      <th style="text-align: center;">기간</th>
                      <th style="text-align: center;">대표 랜딩</th>
                      <th style="text-align: center;">액션</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${slotsTableRowsHtml}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      });

      // 대시보드 통계 수치 주입
      document.getElementById('stat-total-businesses').textContent = `${totalBizCount}개`;
      document.getElementById('stat-active-businesses').textContent = `${activeBizCount}개`;
      document.getElementById('stat-contracted-slots').textContent = `${contractedSlotsCount}개`;
      document.getElementById('stat-exposure-regions').textContent = `${exposureRegionsCount}개`;
      document.getElementById('stat-total-keywords').textContent = `${totalKeywordsCount}개`;
      document.getElementById('stat-no-period-slots').textContent = `${noPeriodSlotsCount}개`;
      document.getElementById('stat-error-businesses').textContent = `${errorBizCount}개`;

      container.innerHTML = html || `<div style="text-align:center; padding: 48px; color: var(--text-muted); font-family: var(--font-family);">검색 및 필터 조건에 부합하는 입점 업체가 존재하지 않습니다.</div>`;
    }

    // 드롭다운 및 리스트 최초 기동
    initDropdowns();
    renderBusinesses();

    // 이벤트 리스너 바인딩
    companyNameInput.addEventListener('input', renderBusinesses);
    categorySelect.addEventListener('change', renderBusinesses);
    regionSelect.addEventListener('change', renderBusinesses);
    statusSelect.addEventListener('change', renderBusinesses);
    expiringCheckbox.addEventListener('change', renderBusinesses);
    migratedCheckbox.addEventListener('change', renderBusinesses);
    noSlotsCheckbox.addEventListener('change', renderBusinesses);
  </script>
</body>
</html>
