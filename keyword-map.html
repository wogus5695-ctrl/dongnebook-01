<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 관리자 페이지이므로 검색 로봇 수집 영구 차단 -->
  <meta name="robots" content="noindex, nofollow">
  <title>[관리자] 키워드맵 제어 대시보드 | 동네책자</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    /* 관리자 보조 전용 주황/회색 디자인 시스템 */
    .admin-banner {
      background-color: #e67e22;
      color: white;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      font-family: var(--font-family);
    }
    .filter-panel {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      font-family: var(--font-family);
    }
    .summary-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .summary-card {
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .summary-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--secondary);
      margin-top: 4px;
    }
    .district-card {
      background-color: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 20px;
      font-family: var(--font-family);
    }
    .district-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-dark);
      border-bottom: 2px solid #e67e22;
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .keyword-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: left;
    }
    .keyword-table th {
      background-color: var(--bg-main);
      padding: 10px;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-dark);
    }
    .keyword-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    /* 상태 표시 배지 규격 */
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: bold;
      text-align: center;
    }
    .badge-landing { background-color: #d5f5e3; color: #196f3d; }
    .badge-ad-yes { background-color: #ebf5fb; color: #1b4f72; }
    .badge-ad-no { background-color: #fef9e7; color: #7d6608; }
    .badge-apply { background-color: #eaf2f8; color: #2471a3; }
    .badge-hide { background-color: #f2f3f4; color: #5d6d7e; }
    .badge-noindex { background-color: #fadbd8; color: #78281f; }
  </style>
</head>
<body>

  <!-- 공통 헤더 마운트 -->
  <div id="header-container"></div>

  <main class="container" style="margin-top: 12px;">
    
    <!-- 2. 관리자 페이지 안내 배너 -->
    <div class="admin-banner">
      <span>⚙️ 동네책자 지역 키워드 매핑 관리자 모드</span>
      <span style="font-size: 0.75rem; background-color: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px;">OPERATOR ONLY</span>
    </div>

    <div style="margin-bottom: 20px; font-family: var(--font-family);">
      <h1 style="font-size: 1.5rem; font-weight: 900; color: var(--secondary); margin-bottom: 6px;">키워드 생성 및 광고 구좌 맵</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
        각 업종별, 행정동별 랜딩 URL의 광고 결속 상태와 noindex 적용 상태를 실시간 확인하는 모니터링 대시보드입니다.
      </p>
    </div>

    <!-- 3. 필터 영역 -->
    <section class="filter-panel">
      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-category" style="font-size: 0.8rem;">업종 선택</label>
        <select id="filter-category" class="form-select" style="padding: 8px;">
          <option value="all">전체 업종</option>
          <option value="general-cleaning">종합청소</option>
          <option value="waterproof-leak">방수/누수</option>
          <option value="window-caulking">창틀코킹/창틀누수</option>
          <option value="elastic-coating">탄성코트</option>
        </select>
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="search-region" style="font-size: 0.8rem;">지역 검색 (구/동)</label>
        <input type="text" id="search-region" class="form-input" placeholder="예: 강남구 또는 역삼동" style="padding: 8px;">
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="search-task" style="font-size: 0.8rem;">작업명 검색</label>
        <input type="text" id="search-task" class="form-input" placeholder="예: 유리창 또는 방수" style="padding: 8px;">
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-status" style="font-size: 0.8rem;">노출 상태 선택</label>
        <select id="filter-status" class="form-select" style="padding: 8px;">
          <option value="all">전체 상태</option>
          <option value="landing">랜딩 생성</option>
          <option value="ad-yes">광고 있음</option>
          <option value="ad-no">광고 없음</option>
          <option value="apply">신청 가능</option>
          <option value="hide">숨김 (visible: false)</option>
        </select>
      </div>
    </section>

    <!-- 4. 업종별 키워드 요약 -->
    <section class="summary-box" style="font-family: var(--font-family);">
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">총 구좌수 (구/동 조합)</div>
        <div class="summary-value" id="summary-total">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">광고 진행 중 구좌</div>
        <div class="summary-value" id="summary-ad-yes" style="color: var(--primary);">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">광고 공실 구좌</div>
        <div class="summary-value" id="summary-ad-no" style="color: #e67e22;">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">미수집 (noindex) 지면</div>
        <div class="summary-value" id="summary-noindex" style="color: #c0392b;">-</div>
      </div>
    </section>

    <!-- 5. 지역별 키워드 리스트 -->
    <section id="keyword-list-container">
      <!-- JS 렌더링 -->
    </section>

  </main>

  <!-- 7. 관리자 전용 초간소 Footer -->
  <footer style="background-color: var(--bg-card); border-top: 1px solid var(--border-color); padding: 20px 0; margin-top: 48px; text-align: center; font-family: var(--font-family);">
    <div class="container">
      <p style="font-size: 0.75rem; color: var(--text-muted);">
        동네책자 내부 시스템 관리 전용 모니터링 툴입니다. 기밀 및 유출 주의.
      </p>
    </div>
  </footer>

  <script type="module">
    import { renderHeader } from '/src/components/Header.js';
    import { categories } from '/src/data/categories.js';
    import { tasks } from '/src/data/tasks.js';
    import { regions } from '/src/data/regions.js';
    import { businesses } from '/src/data/businesses.js';
    import { adSlots } from '/src/data/adSlots.js';

    // 1. 헤더 마운트
    renderHeader();

    // 2. 관리자 검증 체크 파라미터 (안전장치)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') !== 'true') {
      alert("관리자 권한이 요구되는 페이지입니다.");
      window.location.href = "/";
    }

    const categorySelect = document.getElementById('filter-category');
    const searchRegion = document.getElementById('search-region');
    const searchTask = document.getElementById('search-task');
    const statusSelect = document.getElementById('filter-status');

    // cat 쿼리 파라미터가 있으면 해당 카테고리로 자동 선택
    const catQueryParam = urlParams.get('cat');
    if (catQueryParam && [...categorySelect.options].some(opt => opt.value === catQueryParam)) {
      categorySelect.value = catQueryParam;
    }

    const container = document.getElementById('keyword-list-container');

    // 3. 필터링 및 렌더링 주 연산
    function renderKeywordMap() {
      const activeCats = categories.filter(c => c.visible !== false && c.id !== 'drain-clog');
      const districts = regions.filter(r => r.level === 'district');

      const catFilter = categorySelect.value;
      const regQuery = searchRegion.value.trim().toLowerCase();
      const taskQuery = searchTask.value.trim().toLowerCase();
      const statusFilter = statusSelect.value;

      let html = "";
      
      let totalCount = 0;
      let adYesCount = 0;
      let adNoCount = 0;
      let noindexCount = 0;

      districts.forEach(dist => {
        // 해당 구의 하위 동 리스트 수집
        const subNeighborhoods = regions.filter(r => r.parentId === dist.id);
        const allTargetRegs = [dist, ...subNeighborhoods];

        let matchedRows = [];

        allTargetRegs.forEach(reg => {
          // 해당 지역이 숨김 상태라면 스킵
          if (reg.visible === false) return;

          activeCats.forEach(cat => {
            if (catFilter !== 'all' && cat.id !== catFilter) return;

            const associatedTasks = tasks.filter(t => t.categoryIds.includes(cat.id) && t.visible);

            associatedTasks.forEach(task => {
              if (taskQuery && !task.name.toLowerCase().includes(taskQuery)) return;
              if (regQuery && !reg.displayName.toLowerCase().includes(regQuery)) return;

              // 1. 광고 구좌 매칭 유무 판정
              const CURRENT_DATE = new Date("2026-06-30T10:30:00+09:00");
              const activeSlot = adSlots.find(slot => {
                if (slot.status !== "active") return false;
                if (slot.categoryId !== cat.id) return false;

                const taskMatches = slot.coverageTaskMode === "all-category-tasks" || slot.taskId === task.id;
                if (!taskMatches) return false;

                if (slot.startDate !== null) {
                  const start = new Date(slot.startDate);
                  if (CURRENT_DATE < start) return false;
                }
                if (slot.endDate !== null) {
                  const end = new Date(slot.endDate);
                  if (CURRENT_DATE > end) return false;
                }

                if (reg.level === "district") {
                  return slot.purchaseRegionId === reg.id;
                } else if (reg.level === "neighborhood") {
                  return slot.purchaseRegionId === reg.parentId;
                }
                return false;
              });

              const hasAd = !!activeSlot;
              
              // 2. 상태 뱃지 판독
              let isLandingCreated = false;
              if (reg.level === 'district') {
                isLandingCreated = true; // 구 단위는 sitemap 등에 포함되는 기본 정적 생성 단위
              }

              // 3. noindex 여부 (동 단위는 noindex 처리됨)
              const isNoindex = reg.level === 'neighborhood';

              // 상태 필터링 매칭
              let statusText = "신청 가능";
              let badgeClass = "badge-apply";

              if (hasAd) {
                statusText = "광고 있음";
                badgeClass = "badge-ad-yes";
              } else {
                statusText = "광고 없음";
                badgeClass = "badge-ad-no";
              }

              if (statusFilter !== 'all') {
                if (statusFilter === 'landing' && reg.level !== 'district') return;
                if (statusFilter === 'ad-yes' && !hasAd) return;
                if (statusFilter === 'ad-no' && hasAd) return;
                if (statusFilter === 'apply' && hasAd) return;
              }

              // 통계 카운트 증가
              totalCount++;
              if (hasAd) adYesCount++;
              else adNoCount++;
              if (isNoindex) noindexCount++;

              const detailUrl = `/landing.html?reg=${encodeURIComponent(reg.displayName)}&cat=${cat.id}&task=${task.id}`;

              matchedRows.push({
                regionName: reg.displayName,
                levelName: reg.level === 'district' ? '구' : '동',
                taskName: task.name,
                url: detailUrl,
                statusText: statusText,
                badgeClass: badgeClass,
                isNoindex: isNoindex
              });

            });
          });
        });

        // 매칭된 항목이 있을 때만 구 단위 카드 생성
        if (matchedRows.length > 0) {
          html += `
            <div class="district-card">
              <div class="district-title">
                <span>📍 ${dist.province} ${dist.displayName}</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;">매칭 구좌수: ${matchedRows.length}개</span>
              </div>
              <div style="overflow-x: auto;">
                <table class="keyword-table">
                  <thead>
                    <tr>
                      <th style="width: 25%;">대상 지역</th>
                      <th style="width: 25%;">작업명</th>
                      <th style="width: 20%;">상태 배지</th>
                      <th style="width: 30%;">랜딩 페이지 URL</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${matchedRows.map(row => `
                      <tr>
                        <td><strong>${row.regionName}</strong> <span style="font-size:0.7rem; color:var(--text-muted);">(${row.levelName})</span></td>
                        <td>${row.taskName}</td>
                        <td>
                          <span class="status-badge ${row.badgeClass}">${row.statusText}</span>
                          ${row.isNoindex ? '<span class="status-badge badge-noindex">noindex</span>' : '<span class="status-badge badge-landing">정적생성</span>'}
                        </td>
                        <td>
                          <a href="${row.url}" target="_blank" style="color: var(--primary); text-decoration: underline;">랜딩 이동 ↗</a>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html || `<div style="text-align:center; padding: 48px; color: var(--text-muted); font-family: var(--font-family);">필터 조건에 부합하는 키워드 매핑 구좌가 존재하지 않습니다.</div>`;

      // 요약 카드 대입
      document.getElementById('summary-total').textContent = `${totalCount}개`;
      document.getElementById('summary-ad-yes').textContent = `${adYesCount}개`;
      document.getElementById('summary-ad-no').textContent = `${adNoCount}개`;
      document.getElementById('summary-noindex').textContent = `${noindexCount}개`;
    }

    // 4. 이벤트 바인딩
    categorySelect.addEventListener('change', renderKeywordMap);
    searchRegion.addEventListener('input', renderKeywordMap);
    searchTask.addEventListener('input', renderKeywordMap);
    statusSelect.addEventListener('change', renderKeywordMap);

    // 최초 렌더링 가동
    renderKeywordMap();
  </script>
</body>
</html>
