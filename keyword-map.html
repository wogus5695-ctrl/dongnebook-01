<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 관리자 페이지이므로 검색 로봇 수집 영구 차단 -->
  <meta name="robots" content="noindex, nofollow">
  <title>[관리자] 키워드맵 제어 대시보드 | 동네책자</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    /* 관리자 보조 전용 주황/회색 디자인 시스템 */
    .admin-banner {
      background-color: #e67e22;
      color: white;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      font-family: var(--font-family);
    }
    .filter-panel {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      font-family: var(--font-family);
    }
    .summary-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .summary-card {
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .summary-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--secondary);
      margin-top: 4px;
    }
    .district-card {
      background-color: white;
      border: 1.5px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 20px;
      margin-bottom: 20px;
      font-family: var(--font-family);
    }
    .district-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-dark);
      border-bottom: 2px solid #e67e22;
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .keyword-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: left;
    }
    .keyword-table th {
      background-color: var(--bg-main);
      padding: 10px;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-dark);
    }
    .keyword-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    /* 상태 표시 배지 규격 */
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: bold;
      text-align: center;
    }
    .badge-landing { background-color: #d5f5e3; color: #196f3d; }
    .badge-ad-yes { background-color: #ebf5fb; color: #1b4f72; }
    .badge-ad-no { background-color: #fef9e7; color: #7d6608; }
    .badge-apply { background-color: #eaf2f8; color: #2471a3; }
    .badge-hide { background-color: #f2f3f4; color: #5d6d7e; }
    .badge-noindex { background-color: #fadbd8; color: #78281f; }
  </style>
</head>
<body>

  <!-- 공통 헤더 마운트 -->
  <div id="header-container"></div>

  <main class="container" style="margin-top: 12px;">
    
    <!-- 2. 관리자 페이지 안내 배너 -->
    <div class="admin-banner">
      <span>⚙️ 동네책자 지역 키워드 매핑 관리자 모드</span>
      <span style="font-size: 0.75rem; background-color: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px;">OPERATOR ONLY</span>
    </div>

    <div style="margin-bottom: 20px; font-family: var(--font-family);">
      <h1 style="font-size: 1.5rem; font-weight: 900; color: var(--secondary); margin-bottom: 6px;">키워드 생성 및 광고 구좌 맵</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
        각 업종별, 행정동별 랜딩 URL의 광고 결속 상태와 noindex 적용 상태를 실시간 확인하는 모니터링 대시보드입니다.
      </p>
    </div>

    <!-- 3. 필터 영역 -->
    <section class="filter-panel">
      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-category" style="font-size: 0.8rem;">업종 선택</label>
        <select id="filter-category" class="form-select" style="padding: 8px;">
          <option value="all">전체 업종</option>
          <option value="general-cleaning">종합청소</option>
          <option value="waterproof-leak">방수/누수</option>
          <option value="window-caulking">창틀코킹/창틀누수</option>
          <option value="elastic-coating">탄성코트</option>
        </select>
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="search-region" style="font-size: 0.8rem;">지역 검색 (구/동)</label>
        <input type="text" id="search-region" class="form-input" placeholder="예: 강남구 또는 역삼동" style="padding: 8px;">
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="search-task" style="font-size: 0.8rem;">작업명 검색</label>
        <input type="text" id="search-task" class="form-input" placeholder="예: 유리창 또는 방수" style="padding: 8px;">
      </div>

      <div class="form-group" style="margin: 0;">
        <label class="form-label" for="filter-status" style="font-size: 0.8rem;">노출 상태 선택</label>
        <select id="filter-status" class="form-select" style="padding: 8px;">
          <option value="all">전체 상태</option>
          <option value="landing">랜딩 생성</option>
          <option value="ad-yes">광고 있음</option>
          <option value="ad-no">광고 없음</option>
          <option value="apply">신청 가능</option>
          <option value="hide">숨김 (visible: false)</option>
        </select>
      </div>
    </section>

    <!-- 4. 업종별 키워드 요약 -->
    <section class="summary-box" style="font-family: var(--font-family);">
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">총 구좌수 (구/동 조합)</div>
        <div class="summary-value" id="summary-total">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">광고 진행 중 구좌</div>
        <div class="summary-value" id="summary-ad-yes" style="color: var(--primary);">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">광고 공실 구좌</div>
        <div class="summary-value" id="summary-ad-no" style="color: #e67e22;">-</div>
      </div>
      <div class="summary-card">
        <div style="font-size: 0.75rem; color: var(--text-muted);">미수집 (noindex) 지면</div>
        <div class="summary-value" id="summary-noindex" style="color: #c0392b;">-</div>
      </div>
    </section>

    <!-- 5. 지역별 키워드 리스트 -->
    <section id="keyword-list-container">
      <!-- JS 렌더링 -->
    </section>

  </main>

  <!-- 7. 관리자 전용 초간소 Footer -->
  <footer style="background-color: var(--bg-card); border-top: 1px solid var(--border-color); padding: 20px 0; margin-top: 48px; text-align: center; font-family: var(--font-family);">
    <div class="container">
      <p style="font-size: 0.75rem; color: var(--text-muted);">
        동네책자 내부 시스템 관리 전용 모니터링 툴입니다. 기밀 및 유출 주의.
      </p>
    </div>
  </footer>

  <script type="module">
    import { renderHeader } from '/src/components/Header.js';
    import { categories } from '/src/data/categories.js';
    import { tasks } from '/src/data/tasks.js';
    import { regions } from '/src/data/regions.js';
    import { businesses } from '/src/data/businesses.js';
    import { adSlots } from '/src/data/adSlots.js';

    // 1. 헤더 마운트
    renderHeader();

    // 2. 관리자 검증 체크 파라미터 (안전장치)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') !== 'true') {
      alert("관리자 권한이 요구되는 페이지입니다.");
      window.location.href = "/";
    }

    const categorySelect = document.getElementById('filter-category');
    const searchRegion = document.getElementById('search-region');
    const searchTask = document.getElementById('search-task');
    const statusSelect = document.getElementById('filter-status');

    // cat 쿼리 파라미터가 있으면 해당 카테고리로 자동 선택
    const catQueryParam = urlParams.get('cat');
    if (catQueryParam && [...categorySelect.options].some(opt => opt.value === catQueryParam)) {
      categorySelect.value = catQueryParam;
    }

    const container = document.getElementById('keyword-list-container');

    // 3. 필터링 및 렌더링 주 연산
    function renderKeywordMap() {
      const catFilter = categorySelect.value;
      const regQuery = searchRegion.value.trim().toLowerCase();
      const taskQuery = searchTask.value.trim().toLowerCase();

      if (catFilter === 'all') {
        container.innerHTML = `<div style="text-align:center; padding: 48px; color: var(--text-muted); font-family: var(--font-family);">상단의 업종 선택 필터에서 특정 업종을 선택하시면 구 단위 광고 구좌 현황판이 활성화됩니다.</div>`;
        document.getElementById('summary-total').textContent = "-";
        document.getElementById('summary-ad-yes').textContent = "-";
        document.getElementById('summary-ad-no').textContent = "-";
        document.getElementById('summary-noindex').textContent = "-";
        return;
      }

      const cat = categories.find(c => c.id === catFilter);
      if (!cat) return;

      const associatedTasks = tasks.filter(t => t.categoryIds.includes(cat.id) && t.visible);
      const districts = regions.filter(r => r.level === 'district' && r.visible !== false);

      let totalSlots = districts.length * 4;
      let adYesCount = 0;
      let noindexCount = 0;

      let html = `
        <div style="overflow-x: auto; background-color: white; border: 1.5px solid var(--border-color); border-radius: var(--border-radius); padding: 16px;">
          <table class="keyword-table">
            <thead>
              <tr>
                <th style="width: 10%;">대상 구</th>
                <th style="width: 20%;">포함 동/면/읍</th>
                <th style="width: 15%;">적용 작업명</th>
                <th style="width: 8%;">생성 키워드 수</th>
                <th style="width: 8%;">1번 구좌</th>
                <th style="width: 8%;">2번 구좌</th>
                <th style="width: 8%;">3번 구좌</th>
                <th style="width: 8%;">4번 구좌</th>
                <th style="width: 6%;">남은 구좌</th>
                <th style="width: 11%;">대표 랜딩</th>
                <th style="width: 6%;">상세</th>
              </tr>
            </thead>
            <tbody>
      `;

      // 글로벌 복사 및 토글 함수 마운트
      window.copyToClipboard = function(text, btnId) {
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.getElementById(btnId);
          if (btn) {
            const originalText = btn.textContent;
            btn.textContent = "복사됨";
            btn.style.backgroundColor = "#2ecc71";
            btn.style.color = "white";
            setTimeout(() => {
              btn.textContent = originalText;
              btn.style.backgroundColor = "";
              btn.style.color = "";
            }, 1200);
          }
        });
      };

      window.toggleKeywords = function(panelId) {
        const panel = document.getElementById(panelId);
        if (panel) {
          panel.style.display = panel.style.display === "none" ? "table-row" : "none";
        }
      };

      districts.forEach(dist => {
        // 지역 필터 검증
        if (regQuery && !dist.displayName.toLowerCase().includes(regQuery)) {
          // 혹시 하위 동 명칭이라도 매칭되는지 확인
          const hasMatchingSubReg = regions.some(r => r.parentId === dist.id && r.displayName.toLowerCase().includes(regQuery));
          if (!hasMatchingSubReg) return;
        }

        const subNeighborhoods = regions.filter(r => r.parentId === dist.id && r.visible !== false);
        noindexCount += subNeighborhoods.length;

        // 구 단위 active slots
        const distSlots = adSlots.filter(slot => {
          return slot.status === "active" &&
                 slot.categoryId === cat.id &&
                 slot.purchaseRegionId === dist.id;
        });

        adYesCount += distSlots.length;

        // 1번 ~ 4번 구좌 매칭
        const slot1 = distSlots.find(s => s.slotNumber === 1 || s.priority === 1);
        const slot2 = distSlots.find(s => s.slotNumber === 2);
        const slot3 = distSlots.find(s => s.slotNumber === 3);
        const slot4 = distSlots.find(s => s.slotNumber === 4);

        const slot1Biz = slot1 ? (businesses.find(b => b.id === slot1.businessId)?.brandName || '') : '';
        const slot2Biz = slot2 ? (businesses.find(b => b.id === slot2.businessId)?.brandName || '') : '';
        const slot3Biz = slot3 ? (businesses.find(b => b.id === slot3.businessId)?.brandName || '') : '';
        const slot4Biz = slot4 ? (businesses.find(b => b.id === slot4.businessId)?.brandName || '') : '';

        const remainingSlots = 4 - distSlots.length;
        const remainingText = remainingSlots === 0 ? '<span style="color:red; font-weight:bold;">마감</span>' : `${remainingSlots}개`;

        // 포함 동 텍스트 (앞 5개 노출 후 외 n개)
        const neighborhoodNames = subNeighborhoods.map(r => r.displayName.split(' ').pop());
        let neighborhoodText = neighborhoodNames.slice(0, 5).join(', ');
        if (neighborhoodNames.length > 5) {
          neighborhoodText += ` 외 ${neighborhoodNames.length - 5}개`;
        }

        // 적용 작업명 전체
        const taskNames = associatedTasks.map(t => t.name);
        const taskDisplayNames = associatedTasks.map(t => t.displayName || t.name);
        let taskText = taskDisplayNames.slice(0, 3).join(', ');
        if (taskDisplayNames.length > 3) {
          taskText += ` 외 ${taskDisplayNames.length - 3}개`;
        }

        // 생성 키워드 수
        const keywordsCount = (1 + subNeighborhoods.length) * associatedTasks.length;

        // 대표 랜딩 URL
        const firstTask = associatedTasks[0] || { id: 'elastic-coating' };
        const landingUrl = `/landing.html?reg=${encodeURIComponent(dist.displayName)}&cat=${cat.id}&task=${firstTask.id}`;
        const fullLandingUrl = `${window.location.origin}${landingUrl}`;
        const copyBtnId = `copy-btn-${dist.id}`;

        // 펼침 패널 ID
        const panelId = `panel-${dist.id}`;

        // 전체 키워드 목록 생성
        let expandedKeywordsHtml = '';
        
        // 구 단위 키워드
        expandedKeywordsHtml += `<div style="margin-bottom: 8px;"><strong>🏢 구 단위 키워드:</strong><div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;">`;
        associatedTasks.forEach(t => {
          expandedKeywordsHtml += `<span style="background-color: #ebf5fb; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">${dist.displayName.split(' ').pop()} ${t.name}</span>`;
        });
        expandedKeywordsHtml += `</div></div>`;

        // 동 단위 키워드
        expandedKeywordsHtml += `<div><strong>📍 동 단위 키워드:</strong><div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;">`;
        subNeighborhoods.forEach(neigh => {
          associatedTasks.forEach(t => {
            expandedKeywordsHtml += `<span style="background-color: #fdfefe; border: 1px solid #ebedef; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">${neigh.displayName.split(' ').pop()} ${t.name}</span>`;
          });
        });
        expandedKeywordsHtml += `</div></div>`;

        html += `
          <tr>
            <td><strong>${dist.displayName.split(' ').pop()}</strong></td>
            <td><span title="${neighborhoodNames.join(', ')}" style="cursor: help; text-decoration: underline dashed var(--text-muted);">${neighborhoodText}</span></td>
            <td><span title="${taskDisplayNames.join(', ')}" style="cursor: help; text-decoration: underline dashed var(--text-muted);">${taskText}</span></td>
            <td><strong>${keywordsCount}</strong>개</td>
            <td>${slot1Biz}</td>
            <td>${slot2Biz}</td>
            <td>${slot3Biz}</td>
            <td>${slot4Biz}</td>
            <td>${remainingText}</td>
            <td>
              <div style="display: flex; gap: 4px; align-items: center;">
                <a href="${landingUrl}" target="_blank" style="color: var(--primary); text-decoration: underline; font-weight: bold;">이동</a>
                <button id="${copyBtnId}" class="btn btn-outline" style="font-size: 0.65rem; padding: 2px 6px; width: auto;" onclick="copyToClipboard('${fullLandingUrl}', '${copyBtnId}')">복사</button>
              </div>
            </td>
            <td>
              <button class="btn btn-outline" style="font-size: 0.65rem; padding: 2px 6px; width: auto; background-color: #f2f4f4;" onclick="toggleKeywords('${panelId}')">보기</button>
            </td>
          </tr>
          <tr id="${panelId}" style="display: none; background-color: #fafbfb;">
            <td colspan="11" style="padding: 16px; border-bottom: 2px solid var(--border-color);">
              <div style="font-family: var(--font-family); font-size: 0.8rem; line-height: 1.6;">
                <div style="margin-bottom: 12px; font-weight: bold; font-size: 0.85rem; color: var(--secondary);">📍 ${dist.displayName} 전체 동적키워드 조합 리스트</div>
                ${expandedKeywordsHtml}
              </div>
            </td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = html;

      // 요약 카드 업데이트
      document.getElementById('summary-total').textContent = `${totalSlots}개`;
      document.getElementById('summary-ad-yes').textContent = `${adYesCount}개`;
      document.getElementById('summary-ad-no').textContent = `${totalSlots - adYesCount}개`;
      document.getElementById('summary-noindex').textContent = `${noindexCount}개`;
    }

    // 4. 이벤트 바인딩
    categorySelect.addEventListener('change', renderKeywordMap);
    searchRegion.addEventListener('input', renderKeywordMap);
    searchTask.addEventListener('input', renderKeywordMap);
    statusSelect.addEventListener('change', renderKeywordMap);

    // 최초 렌더링 가동
    renderKeywordMap();
  </script>
</body>
</html>
