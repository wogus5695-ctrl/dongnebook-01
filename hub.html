<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역별 키워드 허브 | 동네책자</title>
  <meta name="description" content="동네책자에서 각 지역별 시공·수리 전문 파트너 업체를 찾아보세요.">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="/src/css/main.css">
  <style>
    main.container {
      max-width: 1000px !important;
    }
  </style>
</head>
<body>

  <!-- 공통 헤더 컨테이너 -->
  <div id="header-container"></div>

  <main class="container">
    
    <!-- Breadcrumb -->
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; font-family: var(--font-family); margin-top: 16px;">
      홈 &gt; <span id="bread-category" style="font-weight: bold; color: var(--primary);">키워드 허브</span>
    </div>

    <!-- 1. Hero 섹션 -->
    <section class="section" style="border-bottom: 1px solid var(--border-color); padding-bottom: 24px;">
      <h1 class="section-title" id="hub-h1" style="font-size: 1.6rem; color: var(--secondary);">
        시공·수리 지역별 키워드 허브
      </h1>
      <p class="section-subtitle" id="hub-subtitle">서울·경기 주요 지역의 상담 가능 업체 페이지를 지역별 키워드로 확인해보세요.</p>
      
      <!-- 대 카테고리 스위치 탭 -->
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-top: 16px;" id="hub-tabs">
        <!-- JS 탭 렌더러 -->
      </div>
    </section>

    <!-- 2. 세부 작업 키워드 바로가기 (목차) -->
    <section class="section" style="padding: 24px 0 12px;">
      <h2 style="font-size: 1.15rem; margin-bottom: 6px;">세부 작업 키워드 바로가기</h2>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">원하시는 구체적인 작업을 고르시면 상세 정보 페이지로 바로 안내합니다.</p>
      
      <div class="task-card-grid" id="hub-tasks-grid">
        <!-- JS 렌더링 -->
      </div>
    </section>

    <!-- 3. 지역별 빠른 디렉토리 링크 (핵심 섹션) -->
    <section class="section" style="padding: 12px 0;">
      <h2 style="font-size: 1.15rem; margin-bottom: 12px;">지역별 빠른 디렉토리 링크</h2>
      <div class="region-section" id="hub-regions-grid" style="margin-top: 0; padding: 20px;">
        <!-- JS 렌더링 -->
      </div>
    </section>

    <!-- 4. 관련 시공 분야 바로가기 -->
    <section class="section" style="border-top: 1px solid var(--border-color); padding-top: 24px; margin-top: 24px;">
      <h2 style="font-size: 1.15rem; margin-bottom: 12px;">관련 시공 분야 바로가기</h2>
      <div id="hub-related-categories" class="region-links-wrapper">
        <!-- JS 동적 로드 -->
      </div>
    </section>

    <!-- 5. 하단 약한 CTA -->
    <section class="section text-center" style="padding: 20px 0; border-top: 1px solid var(--border-color); margin-top: 32px;">
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
        이 업종에서 업체를 운영 중이신가요?
      </p>
      <a href="/apply.html" id="hub-ad-cta-btn" style="font-size: 0.85rem; color: var(--primary); font-weight: bold; text-decoration: underline;">광고 입점 문의</a>
    </section>

  </main>

  <!-- 공통 푸터 컨테이너 -->
  <div id="footer-container"></div>

  <script type="module">
    import { renderHeader } from '/src/components/Header.js';
    import { renderFooter } from '/src/components/Footer.js';
    import { categories, OPERATED_CATEGORIES } from '/src/data/categories.js';
    import { tasks } from '/src/data/tasks.js';
    import { regions } from '/src/data/regions.js';
    import { businesses } from '/src/data/businesses.js';
    import { adSlots } from '/src/data/adSlots.js';
    import { updateSeoMeta } from '/src/components/SeoMeta.js';
    import { buildLandingUrl } from '/src/utils/urlHelper.js';

    renderHeader();
    renderFooter();

    // 1. URL 파라미터 기반 카테고리 선정
    const activeCategories = categories.filter(c => c.visible !== false);
    const urlParams = new URLSearchParams(window.location.search);
    let activeCatId = urlParams.get('cat') || activeCategories[0].id;


    // 만약 admin=true 인 경우 즉시 관리자 지면으로 우회 분기
    if (urlParams.get('admin') === 'true') {
      const targetCat = !OPERATED_CATEGORIES.includes(activeCatId) ? '' : `&cat=${activeCatId}`;
      window.location.href = `/keyword-map.html?admin=true${targetCat}`;
    }

    let activeCat = activeCategories.find(c => c.id === activeCatId);

    // 카테고리 유효성 필터 및 미운영 예외 처리
    if (!activeCat || !OPERATED_CATEGORIES.includes(activeCatId)) {
      const mainEl = document.querySelector('main.container');
      if (mainEl) {
        mainEl.innerHTML = `
          <div style="max-width: 600px; margin: 80px auto; padding: 40px 24px; background-color: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: var(--border-radius); text-align: center; font-family: var(--font-family); box-shadow: var(--shadow-sm);">
            <div style="font-size: 3rem; margin-bottom: 20px;">🛠️</div>
            <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--secondary); margin-bottom: 12px;">서비스 비활성화</h2>
            <p style="font-size: 0.9rem; color: var(--text-dark); line-height: 1.6; margin-bottom: 24px;">
              요청하신 업종 서비스는 더 이상 동네책자에서 운영되지 않거나 준비 중입니다.<br>
              방수/누수, 창틀코킹, 탄성코트 등 타 분야 시공 서비스를 이용해 주시기 바랍니다.
            </p>
            <a href="/" class="btn btn-outline" style="font-size: 0.85rem; padding: 10px 20px; text-decoration: none; display: inline-block;">홈으로 돌아가기</a>
          </div>
        `;
      }
    } else {
      // 카테고리별 H1 및 매핑 정보
      const hubSeoMap = {
        "waterproof-leak": {
          h1: "방수·누수 지역별 키워드 허브",
          title: "방수·누수 지역별 키워드 허브 | 동네책자",
          description: "서울·경기 주요 지역의 방수·누수 상담 가능 업체 페이지를 지역별 키워드로 확인해보세요."
        },
        "window-caulking": {
          h1: "창틀코킹·창틀누수 지역별 키워드 허브",
          title: "창틀코킹·창틀누수 지역별 키워드 허브 | 동네책자",
          description: "서울·경기 주요 지역의 창틀코킹·창틀누수 상담 가능 업체 페이지를 지역별 키워드로 확인해보세요."
        },
        "elastic-coating": {
          h1: "탄성코트 지역별 키워드 허브",
          title: "탄성코트 지역별 키워드 허브 | 동네책자",
          description: "서울·경기 주요 지역의 탄성코트 상담 가능 업체 페이지를 지역별 키워드로 확인해보세요."
        }
      };

      const currentSeo = hubSeoMap[activeCat.id] || {
        h1: "시공·수리 지역별 키워드 허브",
        title: "시공·수리 지역별 키워드 허브 | 동네책자",
        description: "서울·경기 주요 지역의 시공·수리 상담 가능 업체 페이지를 지역별 키워드로 확인해보세요."
      };

      // 2. SEO 메타 설정 및 캐노니컬 삽입
      updateSeoMeta({
        title: currentSeo.title,
        description: currentSeo.description,
        h1Text: currentSeo.h1,
        noindex: false
      });

      let canonicalLink = document.querySelector("link[rel='canonical']");
      if (!canonicalLink) {
        canonicalLink = document.createElement('link');
        canonicalLink.rel = 'canonical';
        document.head.appendChild(canonicalLink);
      }
      canonicalLink.href = `https://dongnebook-01.vercel.app/hub.html?cat=${activeCat.id}`;

      document.getElementById('bread-category').textContent = `${activeCat.name} 키워드 허브`;
      document.getElementById('hub-subtitle').textContent = currentSeo.description;
      document.getElementById('hub-ad-cta-btn').href = `/apply.html?cat=${activeCat.id}`;

      // 3. 탭 렌더링
      const tabsBox = document.getElementById('hub-tabs');
      if (tabsBox) {
        tabsBox.innerHTML = activeCategories.filter(c => OPERATED_CATEGORIES.includes(c.id)).map(cat => {
          const isActive = cat.id === activeCatId;
          return `
            <button class="btn ${isActive ? 'btn-primary' : 'btn-outline'}" 
                    style="width: auto; white-space: nowrap; font-size: 0.85rem; padding: 8px 16px;" 
                    onclick="window.location.href='/hub.html?cat=${cat.id}'">
              ${cat.name}
            </button>
          `;
        }).join('');
      }

      // 4. 세부 작업 바로가기 목록 렌더링 (HTML 크롤러 최적화 a 태그)
      const subTasks = tasks.filter(t => t.categoryIds.includes(activeCat.id) && t.visible);
      const tasksGrid = document.getElementById('hub-tasks-grid');
      if (tasksGrid) {
        tasksGrid.innerHTML = subTasks.map(t => {
          const path = buildLandingUrl('서울 은평구', activeCat.id, t.id);
          return `
            <a href="${path}" class="task-click-card" style="text-decoration: none; display: block;">
              ${t.name}
            </a>
          `;
        }).join('');
      }

      // 5. 지역 및 세부 작업 롱테일 내부링크 로드 (details/summary 구조 & generatePublicHubInventory 통합)
      function generatePublicHubInventory(categoryId) {
        const regGrid = document.getElementById('hub-regions-grid');
        if (!regGrid) return;

        const subTasks = tasks.filter(t => t.categoryIds.includes(categoryId) && t.visible);
        const districts = regions.filter(r => r.level === 'district' && r.visible !== false);
        const CURRENT_DATE = new Date("2026-06-30T10:30:00+09:00");
        let regionLinksHtml = '';
        let totalLinksRendered = 0;

        districts.forEach(dist => {
          // Check which slots match this district
          const distSlots = adSlots.filter(slot => {
            if (slot.status !== "active") return false;
            if (slot.categoryId !== categoryId) return false;
            if (slot.startDate !== null && CURRENT_DATE < new Date(slot.startDate)) return false;
            if (slot.endDate !== null && CURRENT_DATE > new Date(slot.endDate)) return false;
            return slot.purchaseRegionId === dist.id;
          });

          // Only render district block if there are active matching slots/businesses
          const hasDistrictActiveAd = distSlots.some(slot => {
            const biz = businesses.find(b => b.id === slot.businessId);
            return biz && biz.visible && biz.status === "active";
          });

          if (!hasDistrictActiveAd) return;

          // For the district itself, only render tasks that are covered by active adSlots
          const activeDistrictLinks = [];
          subTasks.forEach(t => {
            const hasTaskAd = distSlots.some(slot => {
              const taskMatches = slot.coverageTaskMode === "all-category-tasks" || slot.taskId === t.id;
              if (!taskMatches) return false;
              const biz = businesses.find(b => b.id === slot.businessId);
              return biz && biz.visible && biz.status === "active";
            });

            if (hasTaskAd) {
              const tKeyword = t.keyword || t.name;
              const path = buildLandingUrl(dist.displayName, categoryId, t.id);
              activeDistrictLinks.push({ path, text: `${dist.displayName.split(' ').pop()} ${tKeyword}` });
              totalLinksRendered++;
            }
          });

          // For each subDong, only render tasks covered by active adSlots
          const activeDongLinks = [];
          const subDongs = regions.filter(r => r.parentId === dist.id && r.level === 'neighborhood' && r.visible !== false);
          
          subDongs.forEach(dong => {
            subTasks.forEach(t => {
              const hasTaskAd = distSlots.some(slot => {
                const taskMatches = slot.coverageTaskMode === "all-category-tasks" || slot.taskId === t.id;
                if (!taskMatches) return false;
                const biz = businesses.find(b => b.id === slot.businessId);
                return biz && biz.visible && biz.status === "active";
              });

              if (hasTaskAd) {
                const tKeyword = t.keyword || t.name;
                const path = buildLandingUrl(dong.displayName, categoryId, t.id);
                const dongShort = dong.neighborhood || dong.displayName.split(' ').pop();
                activeDongLinks.push({ path, text: `${dongShort} ${tKeyword}` });
                totalLinksRendered++;
              }
            });
          });

          // Render details / summary block
          const distCount = activeDistrictLinks.length + activeDongLinks.length;
          regionLinksHtml += `
            <details open style="margin-bottom: 24px; border: 1.5px solid var(--border-color); border-radius: var(--border-radius); padding: 20px; background-color: var(--bg-card); display: block; width: 100%; box-sizing: border-box; box-shadow: var(--shadow-sm);">
              <summary style="font-size: 1.1rem; color: var(--secondary); font-weight: 800; cursor: pointer; padding: 4px; outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px;">
                <span>📍 ${dist.displayName} ${activeCat.name} 키워드</span>
                <span style="font-size: 0.85rem; color: var(--primary); background-color: var(--primary-light); padding: 4px 10px; border-radius: 20px; font-weight: 700;">총 ${distCount}개 링크</span>
              </summary>
              
              <div>
                <!-- 구 단위 세부 링크 -->
                ${activeDistrictLinks.length > 0 ? `
                  <div style="margin-bottom: 16px;">
                    <h3 style="font-size: 0.85rem; color: var(--text-dark); margin-bottom: 8px; font-weight: bold;">🏢 구 단위 키워드</h3>
                    <div class="region-links-wrapper">
                      ${activeDistrictLinks.map(link => `<a href="${link.path}" class="region-bubble" style="border-color: var(--primary);">${link.text}</a>`).join('')}
                    </div>
                  </div>
                ` : ''}

                <!-- 동 단위 세부 링크 -->
                ${activeDongLinks.length > 0 ? `
                  <div>
                    <h3 style="font-size: 0.85rem; color: var(--text-dark); margin-bottom: 8px; font-weight: bold;">📍 동 단위 키워드</h3>
                    <div class="region-links-wrapper">
                      ${activeDongLinks.map(link => `<a href="${link.path}" class="region-bubble">${link.text}</a>`).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            </details>
          `;
        });

        regGrid.innerHTML = regionLinksHtml || `<div style="text-align: center; color: var(--text-muted); padding: 20px;">이 업종에 활성화된 매칭 지역 링크가 없습니다.</div>`;
        console.log(`[완료] 총 생성된 공개 허브 링크 수: ${totalLinksRendered}개`);
      }

      // 인벤토리 생성 호출
      generatePublicHubInventory(activeCat.id);

      // 6. 관련 업종 허브 링크 렌더링
      const relatedCatsBox = document.getElementById('hub-related-categories');
      if (relatedCatsBox) {
        const otherCats = activeCategories.filter(c => c.id !== activeCat.id && OPERATED_CATEGORIES.includes(c.id));
        relatedCatsBox.innerHTML = otherCats.map(c => `
          <a href="/hub.html?cat=${c.id}" class="region-bubble" style="border-color: var(--secondary);">
            ${c.name} 바로가기
          </a>
        `).join('');
      }
    }
  </script>
</body>
</html>
