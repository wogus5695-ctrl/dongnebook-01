<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO 최적화 메타데이터 -->
  <title>지역 시공·수리 업체 광고 플랫폼 | 동네책자</title>
  <meta name="description" content="청소, 방수, 창틀코킹, 하수구 등 지역 기반 전문 업체를 확인하고 광고 입점을 신청할 수 있는 플랫폼입니다.">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>

  <!-- 공통 헤더 마운팅 -->
  <div id="header-container"></div>

  <main class="container">
    
    <!-- Visually hidden h1 for SEO/accessibility -->
    <h1 class="sr-only">동네책자 - 우리 동네 업체를 한눈에 확인하고 바로 문의</h1>

    <!-- 2. Hero 이미지 배너 섹션 -->
    <section class="main-hero image-hero">
      <img src="/hero-banner.png" alt="우리 동네 업체를 한눈에 확인하고 바로 문의하세요 - 동네책자">
    </section>

    <!-- 3. 우리동네 업체 섹션 (데이터 기반 자동 렌더링) -->
    <section class="section" id="featured-listings-section" style="padding: 24px 0;">
      <!-- JS로 동적 생성됨 -->
    </section>

    <!-- 4. 광고 입점 안내 섹션 (B2B 유도) -->
    <section class="section text-center" style="background-color: var(--bg-card); border-radius: var(--border-radius); border: 1.5px solid var(--border-color); padding: 32px; margin-top: 24px; font-family: var(--font-family);">
      <h2 style="font-size: 1.25rem; color: var(--text-dark); font-weight: 800; margin-bottom: 6px;">우리 동네 업체를 운영 중이신가요?</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; max-width: 480px; margin-left: auto; margin-right: auto;">
        지역명+작업명 페이지에 업체 정보를 등록하고 상담 유입을 테스트할 수 있습니다.
      </p>
      <div style="display: flex; justify-content: center; gap: 8px;">
        <a href="/guide.html" class="btn btn-accent" style="font-size: 0.85rem; padding: 10px 18px; text-decoration: none;">광고 입점 안내 보기</a>
      </div>
    </section>

  </main>

  <!-- 5. Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { renderHeader } from '/src/components/Header.js';
    import { renderFooter } from '/src/components/Footer.js';
    import { categories } from '/src/data/categories.js';
    import { tasks } from '/src/data/tasks.js';
    import { regions } from '/src/data/regions.js';
    import { businesses } from '/src/data/businesses.js';
    import { adSlots } from '/src/data/adSlots.js';

    // 1. 공통 템플릿 로드
    renderHeader();
    renderFooter();

    // 카테고리별 기본 폴백 이미지 맵
    const categoryDefaultImages = {
      "general-cleaning": "https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=600&q=80",
      "waterproof-leak": "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=600&q=80",
      "window-caulking": "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=600&q=80",
      "elastic-coating": "/assets/thumbs/elastic-coating-bareumspace.jpg"
    };
    const commonPlaceholderImage = "https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=600&q=80";

    // 메인 페이지용 전용 간소화 업체 카드 컴포넌트 함수
    function renderMainCompanyCard(biz, targetRegName, catId, taskId) {
      const catDefaultImage = categoryDefaultImages[catId] || commonPlaceholderImage;
      const cardImage = biz.image || catDefaultImage;

      // 해당 업체의 대표 작업명 추출
      const foundTask = tasks.find(t => t.id === taskId);
      const taskName = foundTask ? foundTask.name : "시공·수리";

      // 해당 업체의 첫 번째 서비스 지역
      const firstRegId = biz.serviceRegionIds[0];
      const foundReg = regions.find(r => r.id === firstRegId);
      const regName = foundReg ? foundReg.displayName : "우리 동네";

      // 상세 이동 경로
      const detailLink = `/landing.html?reg=${encodeURIComponent(targetRegName)}&cat=${catId}&task=${taskId}`;
      
      // 이미지 alt 문구 생성
      const altText = `${targetRegName} ${taskName} 상담 가능 업체 ${biz.brandName}`;

      return `
        <article class="company-card" style="display: flex; flex-direction: column; overflow: hidden; padding: 0;">
          <div style="width: 100%; height: 150px; overflow: hidden;">
            <img src="${cardImage}" alt="${altText}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror=null; this.src='${catDefaultImage}';">
          </div>
          <div style="padding: 16px; display: flex; flex-direction: column; flex-grow: 1; font-family: var(--font-family);">
            <div style="margin-bottom: 4px;">
              <span class="ad-badge" style="background-color: var(--primary-light); color: var(--primary); font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px;">입점 업체</span>
            </div>
            <h3 style="font-size: 1.05rem; margin-bottom: 4px; color: var(--text-dark); font-weight: bold;">${biz.brandName}</h3>
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
              <strong>전문 분야:</strong> ${taskName}<br>
              <strong>주 활동지:</strong> ${regName}
            </p>
            <a href="${detailLink}" class="btn btn-outline" style="font-size: 0.78rem; padding: 8px; text-align: center; text-decoration: none; display: block; margin-top: auto; border-color: var(--border-color); color: var(--text-dark); background-color: white;">
              자세히 보기
            </a>
          </div>
        </article>
      `;
    }

    // 2. 동적 렌더링 로직 실행
    const featuredSection = document.getElementById('featured-listings-section');
    if (featuredSection) {
      // 카테고리 필터링 및 정렬
      const mainCategories = categories
        .filter(c => c.visible === true && c.showOnMain === true && c.publicVisible !== false && c.isActive !== false)
        .sort((a, b) => (a.mainPriority || 999) - (b.mainPriority || 999));

      let sectionHtml = '';

      mainCategories.forEach(cat => {
        // 활성 광고 구좌 찾기
        const activeSlots = adSlots.filter(slot => slot.status === 'active' && slot.categoryId === cat.id);
        if (activeSlots.length === 0) return;

        // 고유 업체 매핑
        const matchedBizs = [];
        const seenBizIds = new Set();

        activeSlots.forEach(slot => {
          if (seenBizIds.has(slot.businessId)) return;
          const biz = businesses.find(b => b.id === slot.businessId);
          if (biz && biz.status === 'active' && biz.visible === true && biz.showOnMain !== false) {
            seenBizIds.add(slot.businessId);
            
            const bizMainPriority = biz.mainPriority !== undefined ? biz.mainPriority : (biz.priority !== undefined ? biz.priority : 999);
            
            matchedBizs.push({
              ...biz,
              mainPriorityVal: bizMainPriority,
              slotTaskId: slot.taskId,
              slotRegionId: slot.purchaseRegionId
            });
          }
        });

        if (matchedBizs.length === 0) return;

        // 정렬 및 최대 3-4개 노출 (3개 노출)
        matchedBizs.sort((a, b) => a.mainPriorityVal - b.mainPriorityVal);
        const displayBizs = matchedBizs.slice(0, 3);

        // 전체보기 링크 생성 (1순위: hub URL, 2순위: 대표 landing URL, 3순위: 숨김)
        let viewAllLink = `/hub.html?cat=${cat.id}`;
        if (cat.id === 'elastic-coating') {
          // 탄성코트 대표 landing URL
          viewAllLink = `/landing.html?reg=${encodeURIComponent('서울 은평구')}&cat=elastic-coating&task=elastic-coating`;
        }

        // 각 카테고리별 업체 그리드 카드 리스트 HTML 생성
        const cardsHtml = displayBizs.map(biz => {
          const foundReg = regions.find(r => r.id === biz.slotRegionId);
          const regionName = foundReg ? foundReg.displayName : "서울 강남구";
          return renderMainCompanyCard(biz, regionName, cat.id, biz.slotTaskId);
        }).join('');

        // 섹션 HTML 조립
        sectionHtml += `
          <div style="margin-bottom: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 18px;">
              <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-dark); margin: 0;">${cat.mainTitle}</h2>
              <a href="${viewAllLink}" style="font-size: 0.8rem; color: var(--primary); font-weight: bold; text-decoration: none;">전체보기 →</a>
            </div>
            <div class="card-grid">
              ${cardsHtml}
            </div>
          </div>
        `;
      });

      featuredSection.innerHTML = sectionHtml;
    }
  </script>
</body>
</html>
