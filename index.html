<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO 최적화 메타데이터 -->
  <title>지역 시공·수리 업체 광고 플랫폼 | 동네책자</title>
  <meta name="description" content="청소, 방수, 창틀코킹, 하수구 등 지역 기반 전문 업체를 확인하고 광고 입점을 신청할 수 있는 플랫폼입니다.">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>

  <!-- 공통 헤더 마운팅 -->
  <div id="header-container"></div>

  <main class="container">
    
    <!-- 2. Hero 이미지 슬라이드 섹션 (브랜드 소개형) -->
    <section class="hero" style="background-color: var(--primary-light); border-radius: var(--border-radius); padding: 48px 24px; text-align: center; margin-bottom: 24px; border: 1.5px solid var(--border-color); font-family: var(--font-family);">
      <h1 style="font-size: clamp(1.4rem, 5vw, 2rem); color: var(--secondary); font-weight: 900; line-height: 1.35; letter-spacing: -0.02em; margin-bottom: 12px;">
        우리 동네 업체를 한눈에 확인하고 바로 문의하세요
      </h1>
      <p style="font-size: 0.95rem; color: var(--text-dark); max-width: 600px; margin: 0 auto 24px auto; line-height: 1.6;">
        청소, 방수, 창틀코킹 등 필요한 작업을 가까운 지역 업체부터 확인할 수 있습니다.
      </p>
      <div style="display: flex; justify-content: center; gap: 8px;">
        <a href="#featured-listings-section" class="btn btn-primary" style="font-size: 0.85rem; padding: 10px 18px; text-decoration: none;">우리동네 입점 업체 보기</a>
      </div>
    </section>

    <!-- 3. 우리동네 업체 섹션 (3개 카테고리별 3개 이하 노출) -->
    <section class="section" id="featured-listings-section" style="padding: 24px 0;">
      
      <!-- 카테고리 1. 유리창청소 (종합청소) -->
      <div style="margin-bottom: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 18px;">
          <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-dark); margin: 0;">우리동네 유리창청소</h2>
          <a href="/landing.html?reg=서울 강남구&cat=general-cleaning&task=window-cleaning" style="font-size: 0.8rem; color: var(--primary); font-weight: bold; text-decoration: none;">전체보기 →</a>
        </div>
        <div class="card-grid" id="featured-cleaning-grid">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 카테고리 2. 외벽방수 (방수/누수) -->
      <div style="margin-bottom: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 18px;">
          <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-dark); margin: 0;">우리동네 외벽방수</h2>
          <a href="/landing.html?reg=서울 송파구&cat=waterproof-leak&task=exterior-waterproof" style="font-size: 0.8rem; color: var(--primary); font-weight: bold; text-decoration: none;">전체보기 →</a>
        </div>
        <div class="card-grid" id="featured-waterproof-grid">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 카테고리 3. 창틀누수 (창틀코킹/창틀누수) -->
      <div style="margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 18px;">
          <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-dark); margin: 0;">우리동네 창틀누수</h2>
          <a href="/landing.html?reg=경기 수원시 영통구&cat=window-caulking&task=window-leak" style="font-size: 0.8rem; color: var(--primary); font-weight: bold; text-decoration: none;">전체보기 →</a>
        </div>
        <div class="card-grid" id="featured-caulking-grid">
          <!-- JS 렌더링 -->
        </div>
      </div>

    </section>

    <!-- 4. 광고 입점 안내 섹션 (B2B 유도) -->
    <section class="section text-center" style="background-color: var(--bg-card); border-radius: var(--border-radius); border: 1.5px solid var(--border-color); padding: 32px; margin-top: 24px; font-family: var(--font-family);">
      <h2 style="font-size: 1.25rem; color: var(--text-dark); font-weight: 800; margin-bottom: 6px;">우리 동네 업체를 운영 중이신가요?</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; max-width: 480px; margin-left: auto; margin-right: auto;">
        지역명+작업명 페이지에 업체 정보를 등록하고 상담 유입을 테스트할 수 있습니다.
      </p>
      <div style="display: flex; justify-content: center; gap: 8px;">
        <a href="/guide.html" class="btn btn-accent" style="font-size: 0.85rem; padding: 10px 18px; text-decoration: none;">광고 입점 안내 보기</a>
      </div>
    </section>

  </main>

  <!-- 5. Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { renderHeader } from '/src/components/Header.js';
    import { renderFooter } from '/src/components/Footer.js';
    import { categories } from '/src/data/categories.js';
    import { tasks } from '/src/data/tasks.js';
    import { regions } from '/src/data/regions.js';
    import { businesses } from '/src/data/businesses.js';
    import { CompanyCard } from '/src/components/CompanyCard.js';

    // 1. 공통 템플릿 로드
    renderHeader();
    renderFooter();

    // 메인 페이지용 전용 간소화 업체 카드 컴포넌트 함수
    function renderMainCompanyCard(biz, targetRegName, catId, taskId) {
      const defaultImage = "https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=600&q=80";
      const cardImage = biz.image || defaultImage;

      // 해당 업체의 대표 작업명 추출
      const foundTask = tasks.find(t => t.id === taskId);
      const taskName = foundTask ? foundTask.name : "시공·수리";

      // 해당 업체의 첫 번째 서비스 지역
      const firstRegId = biz.serviceRegionIds[0];
      const foundReg = regions.find(r => r.id === firstRegId);
      const regName = foundReg ? foundReg.displayName : "우리 동네";

      // 상세 이동 경로
      const detailLink = `/landing.html?reg=${encodeURIComponent(targetRegName)}&cat=${catId}&task=${taskId}`;

      return `
        <article class="company-card" style="display: flex; flex-direction: column; overflow: hidden; padding: 0;">
          <div style="width: 100%; height: 150px; overflow: hidden;">
            <img src="${cardImage}" alt="${biz.brandName}" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <div style="padding: 16px; display: flex; flex-direction: column; flex-grow: 1; font-family: var(--font-family);">
            <div style="margin-bottom: 4px;">
              <span class="ad-badge" style="background-color: var(--primary-light); color: var(--primary); font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px;">입점 업체</span>
            </div>
            <h3 style="font-size: 1.05rem; margin-bottom: 4px; color: var(--text-dark); font-weight: bold;">${biz.brandName}</h3>
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
              <strong>전문 분야:</strong> ${taskName}<br>
              <strong>주 활동지:</strong> ${regName}
            </p>
            <a href="${detailLink}" class="btn btn-outline" style="font-size: 0.78rem; padding: 8px; text-align: center; text-decoration: none; display: block; margin-top: auto; border-color: var(--border-color); color: var(--text-dark); background-color: white;">
              자세히 보기
            </a>
          </div>
        </article>
      `;
    }

    // 2. 주요 3대 카테고리 대표 시드 업체 데이터 로딩 (최대 3개 이하)
    const cleanGrid = document.getElementById('featured-cleaning-grid');
    if (cleanGrid) {
      // 종합청소 - 유리창청소 (window-cleaning)
      const cleaningBizs = businesses.filter(b => b.categoryIds.includes('general-cleaning') && b.taskIds.includes('window-cleaning') && b.status === 'active' && b.visible).slice(0, 3);
      cleanGrid.innerHTML = cleaningBizs.map(biz => renderMainCompanyCard(biz, "서울 강남구", "general-cleaning", "window-cleaning")).join('');
    }

    const waterproofGrid = document.getElementById('featured-waterproof-grid');
    if (waterproofGrid) {
      // 방수/누수 - 외벽방수 (exterior-waterproof)
      const waterproofBizs = businesses.filter(b => b.categoryIds.includes('waterproof-leak') && b.taskIds.includes('exterior-waterproof') && b.status === 'active' && b.visible).slice(0, 3);
      waterproofGrid.innerHTML = waterproofBizs.map(biz => renderMainCompanyCard(biz, "서울 송파구", "waterproof-leak", "exterior-waterproof")).join('');
    }

    const caulkingGrid = document.getElementById('featured-caulking-grid');
    if (caulkingGrid) {
      // 창틀코킹/창틀누수 - 창틀누수 (window-leak)
      const caulkingBizs = businesses.filter(b => b.categoryIds.includes('window-caulking') && b.taskIds.includes('window-leak') && b.status === 'active' && b.visible).slice(0, 3);
      caulkingGrid.innerHTML = caulkingBizs.map(biz => renderMainCompanyCard(biz, "경기 수원시 영통구", "window-caulking", "window-leak")).join('');
    }
  </script>
</body>
</html>
